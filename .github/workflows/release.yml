# Makes a release: push a tag such as v1.1.0 (GitHub Desktop: History, right-click the
# commit, Create Tag, then Push). Builds the Windows installer and the iPhone app and
# publishes both, so the "latest" download links always point to the newest version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell files parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            if ($e.Count) { $bad++; Write-Host "::error file=src/$($_.Name)::$($e[0].Message)" }
          }
          exit $bad

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\KFUPM-Sorter.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: KFUPM-Sorter-Setup
          path: installer/output/KFUPM-Sorter-Setup.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios-app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild -project KFUPMSorter.xcodeproj -scheme KFUPMSorter \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -60; tail -30 build.log; exit 1; }
          grep -c "warning:" build.log || true
          test -d build/Build/Products/Release-iphoneos/KFUPMSorter.app

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-app/build.log

      - name: Package the .ipa
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KFUPMSorter.app Payload/
          zip -qry KFUPM-Sorter-iOS.ipa Payload
          ls -la KFUPM-Sorter-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: KFUPM-Sorter-iOS
          path: ios-app/KFUPM-Sorter-iOS.ipa

  publish:
    needs: [windows, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KFUPM Sorter ${{ github.ref_name }}
          files: |
            out/KFUPM-Sorter-Setup.exe
            out/KFUPM-Sorter-iOS.ipa
          body: |
            ## Download

            - **Windows 10 / 11:** `KFUPM-Sorter-Setup.exe`. No administrator rights needed. If Windows shows "Windows protected your PC", click **More info** then **Run anyway** (the installer is not code-signed yet).
            - **iPhone / iPad:** `KFUPM-Sorter-iOS.ipa`. Install it with Sideloadly (free, from Windows) or use the Shortcut version. See [ios-app/README.md](https://github.com/kal429/kfupm-sorter/blob/main/ios-app/README.md).

            ## What it does

            Pick your courses from the official KFUPM catalog (2,123 courses, 58 departments) and every file you download goes to its course folder on its own. Custom filters for your own folders, everything else sorted by type. English and Arabic interface. It never deletes or overwrites anything.

            ---
            نزّل **KFUPM-Sorter-Setup.exe** لنظام Windows، أو **KFUPM-Sorter-iOS.ipa** لأجهزة iPhone وiPad.
